[project]
name = "demandforecast"
version = "0.1.0"
description = "DemandForecast AI — Drug demand forecasting for Vietnamese pharmacies (PharmLink AI)"
authors = [{ name = "PharmLink AI Team" }]
requires-python = ">=3.11"
license = { text = "Proprietary" }
readme = "README.md"

dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "torch>=2.4.0",
  "pytorch-lightning>=2.4.0",
  "darts>=0.31.0",
  "prophet>=1.1.5",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.5.0",
  "asyncpg>=0.29.0",
  "redis>=5.1.0",
  "mlflow>=2.17.0",
  "structlog>=24.4.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demandforecast"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/demandforecast --cov-report=term-missing --cov-fail-under=80"
